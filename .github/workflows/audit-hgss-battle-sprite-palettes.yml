name: audit-hgss-battle-sprite-palettes

on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/audit_hgss_battle_sprite_palettes.py'
      - '.github/workflows/audit-hgss-battle-sprite-palettes.yml'
      - 'docs/visual_overhaul/HGSS_BATTLE_SPRITE_COMPATIBILITY.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HGSS_COMMIT: 9d8b7591f09b65804da2fb2dfd56f320633e0d36
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Fetch pinned HGSS donor assets
        run: |
          DONOR="$RUNNER_TEMP/pokeheartgold"
          mkdir -p "$DONOR"
          git -C "$DONOR" init
          git -C "$DONOR" remote add origin https://github.com/pret/pokeheartgold.git
          git -C "$DONOR" fetch --depth 1 origin "$HGSS_COMMIT"
          git -C "$DONOR" checkout --detach FETCH_HEAD

      - name: Audit palette/index contract
        run: |
          python tools/visual_overhaul/audit_hgss_battle_sprite_palettes.py \
            --donor-root "$RUNNER_TEMP/pokeheartgold/files/poketool/pokegra/pokegra" \
            --geometry-manifest docs/visual_overhaul/HGSS_BATTLE_SPRITE_COMPATIBILITY.json \
            --report docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_AUDIT.md \
            --manifest docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_COMPATIBILITY.json

      - name: Commit audit outputs
        run: |
          if [ -z "$(git status --porcelain -- docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_AUDIT.md docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_COMPATIBILITY.json)" ]; then
            echo "Battle sprite palette audit outputs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_AUDIT.md docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_COMPATIBILITY.json
          git commit -m "docs: record HGSS battle sprite palette audit"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
