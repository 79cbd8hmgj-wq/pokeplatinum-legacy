name: Lane A final curation

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/visual_overhaul/build_lane_a_final_curation.py"
      - "docs/visual_overhaul/DONOR_REVIEW_QUEUE.json"
      - "docs/visual_overhaul/LANE_A_P1_VISUAL_REVIEW.json"
      - "docs/visual_overhaul/LANE_A_P3_CURATION.json"
      - "docs/visual_overhaul/LANE_A_REVIEW_DECISIONS.json"
      - ".github/workflows/lane-a-final-curation.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build final Lane A curation
        run: |
          python3 tools/visual_overhaul/build_lane_a_final_curation.py \
            --queue docs/visual_overhaul/DONOR_REVIEW_QUEUE.json \
            --p1 docs/visual_overhaul/LANE_A_P1_VISUAL_REVIEW.json \
            --p3 docs/visual_overhaul/LANE_A_P3_CURATION.json \
            --technical-decisions docs/visual_overhaul/LANE_A_REVIEW_DECISIONS.json \
            --write-json docs/visual_overhaul/LANE_A_FINAL_CURATION.json \
            --write-md docs/visual_overhaul/LANE_A_FINAL_CURATION.md

      - name: Validate full Lane A coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("docs/visual_overhaul/LANE_A_FINAL_CURATION.json").read_text())
          assert p["asset_count"] == 40559
          assert sum(p["status_counts"].values()) == 40559
          assert set(p["status_counts"]) <= {"usable", "alternate", "reject", "decode_issue"}
          ids = [r["asset_id"] for r in p["records"]]
          assert len(ids) == len(set(ids)) == 40559
          assert "unreviewed" not in p["status_counts"]
          print("Lane A final status counts:", p["status_counts"])
          print("Lane A source counts:", p["source_status_counts"])
          PY

      - name: Commit final Lane A curation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/visual_overhaul/LANE_A_FINAL_CURATION.json \
            docs/visual_overhaul/LANE_A_FINAL_CURATION.md
          if git diff --cached --quiet; then
            echo "No Lane A final curation changes."
            exit 0
          fi
          git commit -m "visual: complete Lane A curation"
          git push
