name: validate-b1-battle-integration

on:
  pull_request:
    paths:
      - 'src/battle/**'
      - 'src/battle_anim/**'
      - 'res/moves/**'
      - 'tools/visual_overhaul/validate_b1_existing_battle_integration.py'
      - 'tools/visual_overhaul/validate_b1_cinematic_pilots.py'
      - 'tools/visual_overhaul/validate_b1_installed_donor_sprites.py'
      - 'tools/visual_overhaul/build_b1_donor_battle_sprite.py'
      - 'res/graphics/battle/moves/**'
      - 'docs/visual_overhaul/b1_installed_donors/**'
      - 'tools/visual_overhaul/select_b1_battle_donors.py'
      - 'tools/visual_overhaul/b1_donor_effect_import_preflight.py'
      - 'tools/visual_overhaul/export_b1_ranger_effect_cells.py'
      - 'docs/visual_overhaul/selection/IMPLEMENTATION_QUEUE.json'
      - 'docs/visual_overhaul/B2_B8_PREIMPLEMENTATION_MANIFEST.json'
      - 'docs/visual_overhaul/B2_B8_IMPLEMENTATION_HANDOFF.md'
      - 'tools/visual_overhaul/validate_b2_b8_handoff.py'
      - 'tools/visual_overhaul/audit_b2_b8_move_scripts.py'
      - 'tools/visual_overhaul/b2_b8_execution_brief.py'
      - 'docs/visual_overhaul/B2_B8_IMPLEMENTATION_MANIFEST.json'
      - 'docs/visual_overhaul/B2_B8_IMPLEMENTATION_SPEC.md'
      - '.github/workflows/validate-b1-battle-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate donor-to-DS 4bpp conversion
        run: |
          python3 -m pip install --break-system-packages Pillow
          python3 tools/visual_overhaul/test_b1_donor_ds4bpp.py
      - name: Resolve ranked donor effect candidates from Opal database
        run: |
          mkdir -p artifacts/b2-b8-handoff
          python3 tools/visual_overhaul/select_b1_battle_donors.py > artifacts/b2-b8-handoff/ranked-donor-candidates.json
      - name: Verify ranked Ranger source packages and conversion constraints
        run: python3 tools/visual_overhaul/b1_donor_effect_import_preflight.py --output artifacts/b2-b8-handoff/donor-import-preflight.json
      - name: Validate Ranger effect exporter Python source
        run: python3 -m py_compile tools/visual_overhaul/export_b1_ranger_effect_cells.py
      - name: Verify previously merged battle presentation contracts
        run: python3 tools/visual_overhaul/validate_b1_existing_battle_integration.py
      - name: Validate B1 cinematic pilot animation cleanup
        run: python3 tools/visual_overhaul/validate_b1_cinematic_pilots.py
      - name: Validate AV1 existing animation composites
        run: python3 tools/visual_overhaul/validate_av1_battle_presentation.py
      - name: Validate B2-B8 preimplementation handoff provenance
        run: python3 tools/visual_overhaul/validate_b2_b8_handoff.py
      - name: Generate B2-B8 compact move source inventory
        run: python3 tools/visual_overhaul/audit_b2_b8_move_scripts.py --only-mapped --output artifacts/b2-b8-handoff/move-script-inventory.json
      - name: Verify expanded B2-B8 implementation manifest and produce phase briefs
        run: |
          python3 tools/visual_overhaul/b2_b8_execution_brief.py --verify --output artifacts/b2-b8-handoff/manifest-validation.json
          for phase in B2 B3 B4 B5 B6 B7 B8; do
            python3 tools/visual_overhaul/b2_b8_execution_brief.py --phase "$phase" --output "artifacts/b2-b8-handoff/${phase}-implementation-brief.json"
          done
      - name: Upload B2-B8 donor and move evidence for Claude
        uses: actions/upload-artifact@v4
        with:
          name: b2-b8-handoff-evidence
          path: artifacts/b2-b8-handoff/
          if-no-files-found: error
      - name: Validate installed donor battle sprites
        run: python3 tools/visual_overhaul/validate_b1_installed_donor_sprites.py
