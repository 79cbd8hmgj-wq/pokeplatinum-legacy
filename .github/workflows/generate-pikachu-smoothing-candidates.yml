name: generate-pikachu-smoothing-candidates
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/generate_pikachu_smoothing_candidates.py'
      - '.github/workflows/generate-pikachu-smoothing-candidates.yml'
permissions:
  contents: write
jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - run: python -m pip install Pillow
      - run: python tools/visual_overhaul/generate_pikachu_smoothing_candidates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/review/pikachu_native_smoothing_candidates.png
          git commit -m "docs: add Pikachu smoothing candidate sheet" || exit 0
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
