name: Rebuild C3H L3 ledger

on:
  push:
    branches: [ overhaul/c3h-species-compat ]
    paths:
      - '.github/workflows/rebuild-c3h-l3.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message != 'Rebuild C3H L3 Gen II guarded ledger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: overhaul/c3h-species-compat
          fetch-depth: 0
      - name: Generate and validate L3
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          BASE="0fee7dc526f3220dc6a3b58986415446423f83de"
          ops=[]
          def rep(s,a,b): ops.append({"species":s,"operation":"replace_level_move","from":a,"to":b})
          def ins(s,a): ops.append({"species":s,"operation":"insert_level_move","entry":a})
          def stat(s,k,a,b): ops.append({"species":s,"operation":"set_base_stat","stat":k,"from":a,"to":b})
          def abil(s,a,b): ops.append({"species":s,"operation":"set_abilities","from":a,"to":b})

          rep("furret",[56,"MOVE_HYPER_VOICE"],[56,"MOVE_DOUBLE_EDGE"])
          rep("noctowl",[27,"MOVE_TAKE_DOWN"],[27,"MOVE_PSYBEAM"])
          ins("ledian",[20,"MOVE_STAR_JAB"])
          rep("ariados",[23,"MOVE_FURY_SWIPES"],[23,"MOVE_BUG_BITE"])
          rep("ariados",[37,"MOVE_AGILITY"],[37,"MOVE_TOXIC_SPIKES"])
          rep("xatu",[42,"MOVE_FUTURE_SIGHT"],[42,"MOVE_AIR_SLASH"])
          rep("xatu",[47,"MOVE_OMINOUS_WIND"],[47,"MOVE_PSYCHIC"])
          rep("xatu",[59,"MOVE_PSYCHIC"],[59,"MOVE_FUTURE_SIGHT"])
          rep("sunflora",[29,"MOVE_RAZOR_LEAF"],[29,"MOVE_GIGA_DRAIN"])
          rep("girafarig",[28,"MOVE_ASSURANCE"],[28,"MOVE_MIND_STRIKE"])
          rep("dunsparce",[25,"MOVE_PURSUIT"],[25,"MOVE_HEADBUTT"])
          rep("qwilfish",[33,"MOVE_BRINE"],[33,"MOVE_RIPTIDE_RUSH"])
          rep("qwilfish",[37,"MOVE_PIN_MISSILE"],[37,"MOVE_POISON_JAB"])
          rep("qwilfish",[49,"MOVE_POISON_JAB"],[49,"MOVE_PIN_MISSILE"])
          rep("magcargo",[45,"MOVE_ROCK_SLIDE"],[45,"MOVE_POWER_GEM"])

          for k,a,b in [
              ("hp",55,70),("defense",85,100),("special_attack",65,75),
              ("special_defense",85,110),("speed",35,40)
          ]: stat("corsola",k,a,b)
          abil("corsola",["ABILITY_HUSTLE","ABILITY_NATURAL_CURE"],
                        ["ABILITY_SOLID_ROCK","ABILITY_NATURAL_CURE"])

          rep("octillery",[25,"MOVE_OCTAZOOKA"],[26,"MOVE_OCTAZOOKA"])
          for e in [
              [1,"MOVE_POWDER_SNOW"],[7,"MOVE_QUICK_ATTACK"],[12,"MOVE_ICY_WIND"],
              [17,"MOVE_ICE_SHARD"],[22,"MOVE_AERIAL_ACE"],[27,"MOVE_AURORA_BEAM"],
              [32,"MOVE_FROST_RUSH"],[37,"MOVE_AGILITY"],[42,"MOVE_AIR_SLASH"],
              [47,"MOVE_ICE_PUNCH"],[52,"MOVE_DRILL_PECK"]
          ]: ins("delibird",e)
          for k,a,b in [
              ("hp",45,60),("attack",55,80),("defense",45,55),
              ("special_attack",65,80),("special_defense",45,55),("speed",75,110)
          ]: stat("delibird",k,a,b)

          rep("stantler",[21,"MOVE_TAKE_DOWN"],[21,"MOVE_MIND_STRIKE"])

          assert len(ops)==40, len(ops)
          cache={}
          for op in ops:
              s=op["species"]
              if s not in cache:
                  raw=subprocess.check_output(["git","show",f"{BASE}:res/pokemon/{s}/data.json"])
                  cache[s]=(raw,json.loads(raw))
              raw,d=cache[s]
              op["source_sha256"]=hashlib.sha256(raw).hexdigest()
              # reorder to match existing ledgers
              op2={"species":op.pop("species"),"source_sha256":op.pop("source_sha256"),"operation":op.pop("operation"),**op}
              op.clear(); op.update(op2)
              if op["operation"]=="set_base_stat":
                  assert d["base_stats"][op["stat"]]==op["from"], (s,op)
              elif op["operation"]=="set_abilities":
                  assert d["abilities"]==op["from"], (s,op)
              elif op["operation"]=="replace_level_move":
                  assert op["from"] in d["learnset"]["by_level"], (s,op)
              elif op["operation"]=="insert_level_move":
                  assert op["entry"] not in d["learnset"]["by_level"], (s,op)

          out={"version":1,"domain":"pokemon","changes":ops}
          p=Path("overhaul/ledgers/platinum_c3h_l3_gen2_guarded_ledger_v1_rebuilt.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2)+"\n")
          print("L3 operations:",len(ops))
          PY
          git diff --check
      - name: Commit rebuilt ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add overhaul/ledgers/platinum_c3h_l3_gen2_guarded_ledger_v1_rebuilt.json
          git diff --cached --check
          git commit -m 'Rebuild C3H L3 Gen II guarded ledger'
          git push origin HEAD:overhaul/c3h-species-compat
