name: dump-g4-remainder-textures
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - '.github/workflows/dump-g4-remainder-textures.yml'
      - 'tools/visual_overhaul/make_texture_sheet.py'
      - 'res/field/maps/texture_sets/map_texture_set_059.nsbtx'
      - 'res/field/maps/texture_sets/map_texture_set_061.nsbtx'
      - 'res/field/maps/texture_sets/map_texture_set_055.nsbtx'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  dump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - name: Build NitroBTX
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpng-dev
          mkdir -p g4-tools-build
          gcc -std=gnu17 -O2 -Itools/nitrobtx/include             tools/nitrobtx/src/common.c             tools/nitrobtx/src/help.c             tools/nitrobtx/src/main.c             tools/nitrobtx/src/ns/chunks/tex.c             tools/nitrobtx/src/ns/container.c             tools/nitrobtx/src/ns/resource_dict.c             tools/nitrobtx/src/ns/resource_name.c             tools/nitrobtx/src/ns/resource_tree.c             tools/nitrobtx/src/options.c             tools/nitrobtx/src/palette.c             tools/nitrobtx/src/texture.c             -lpng -lm -o g4-tools-build/nitrobtx
          python -m pip install Pillow
      - name: Dump remaining showcase banks
        run: |
          for spec in "g4d_spear:059" "g4e_lakes:061" "g4f_turnback:055"; do
            NAME="${spec%%:*}"
            ID="${spec##*:}"
            DIR="/tmp/$NAME"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            ./g4-tools-build/nitrobtx dump "res/field/maps/texture_sets/map_texture_set_$ID.nsbtx" "$DIR"
            python tools/visual_overhaul/make_texture_sheet.py "$DIR" "docs/visual_overhaul/review/${NAME}_textures.png"
            {
              for p in "$DIR"/*.pal; do
                echo "## $(basename "$p")"
                cat "$p"
              done
            } > "docs/visual_overhaul/review/${NAME}_palettes.txt"
          done
      - name: Commit showcase reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/review/g4d_spear_* docs/visual_overhaul/review/g4e_lakes_* docs/visual_overhaul/review/g4f_turnback_*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add remaining G4 showcase texture reviews"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
