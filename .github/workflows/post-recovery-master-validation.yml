name: post-recovery-master-validation

on:
  push:
    branches:
      - qa/post-recovery-master-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run post-recovery master validator
        run: python3 tools/overhaul/validate_overhaul.py --no-write
