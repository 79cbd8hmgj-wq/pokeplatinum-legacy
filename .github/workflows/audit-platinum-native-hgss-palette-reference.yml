name: audit-platinum-native-hgss-palette-reference
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/audit_platinum_native_hgss_palette_reference.py'
      - '.github/workflows/audit-platinum-native-hgss-palette-reference.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HGSS_COMMIT: 9d8b7591f09b65804da2fb2dfd56f320633e0d36
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - run: python -m pip install Pillow
      - run: |
          D="$RUNNER_TEMP/pokeheartgold"
          git clone --filter=blob:none --no-checkout https://github.com/pret/pokeheartgold.git "$D"
          git -C "$D" checkout "$HGSS_COMMIT" -- files/poketool/pokegra/pokegra
          python tools/visual_overhaul/audit_platinum_native_hgss_palette_reference.py \
            --donor-root "$D/files/poketool/pokegra/pokegra" \
            --report docs/visual_overhaul/PLATINUM_NATIVE_HGSS_PALETTE_REFERENCE.md \
            --manifest docs/visual_overhaul/PLATINUM_NATIVE_HGSS_PALETTE_REFERENCE.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/visual_overhaul/PLATINUM_NATIVE_HGSS_PALETTE_REFERENCE.*
          git commit -m 'docs: record native HGSS palette reference audit' || exit 0
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a