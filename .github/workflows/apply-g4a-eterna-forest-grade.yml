name: apply-g4a-eterna-forest-grade
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/recolor_g4a_eterna.c'
      - 'tools/visual_overhaul/validate_g4a_eterna_recolor.py'
      - '.github/workflows/apply-g4a-eterna-forest-grade.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - name: Build G4A tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpng-dev
          mkdir -p g4-tools-build
          COMMON_SRC="tools/nitrobtx/src/common.c tools/nitrobtx/src/ns/chunks/tex.c tools/nitrobtx/src/ns/container.c tools/nitrobtx/src/ns/resource_dict.c tools/nitrobtx/src/ns/resource_name.c tools/nitrobtx/src/ns/resource_tree.c tools/nitrobtx/src/palette.c tools/nitrobtx/src/texture.c"
          gcc -std=gnu17 -O2 -Itools/nitrobtx/include $COMMON_SRC tools/visual_overhaul/recolor_g4a_eterna.c -lpng -lm -o g4-tools-build/recolor-g4a
          gcc -std=gnu17 -O2 -Itools/nitrobtx/include $COMMON_SRC tools/nitrobtx/src/help.c tools/nitrobtx/src/options.c tools/nitrobtx/src/main.c -lpng -lm -o g4-tools-build/nitrobtx
          python -m pip install Pillow
      - name: Apply isolated Eterna grade
        run: |
          cp res/field/maps/texture_sets/map_texture_set_074.nsbtx /tmp/g4a_before.nsbtx
          ./g4-tools-build/recolor-g4a /tmp/g4a_before.nsbtx /tmp/g4a_after.nsbtx
          mv /tmp/g4a_after.nsbtx res/field/maps/texture_sets/map_texture_set_074.nsbtx
      - name: Validate and render review
        run: |
          rm -rf docs/visual_overhaul/review/g4a_eterna_before docs/visual_overhaul/review/g4a_eterna_dump
          mkdir -p docs/visual_overhaul/review/g4a_eterna_before
          mkdir -p docs/visual_overhaul/review/g4a_eterna_dump/map
          mkdir -p docs/visual_overhaul/review/g4a_eterna_dump/props
          ./g4-tools-build/nitrobtx dump /tmp/g4a_before.nsbtx docs/visual_overhaul/review/g4a_eterna_before
          ./g4-tools-build/nitrobtx dump res/field/maps/texture_sets/map_texture_set_074.nsbtx docs/visual_overhaul/review/g4a_eterna_dump/map
          ./g4-tools-build/nitrobtx dump res/field/props/texture_sets/prop_texture_set_050.nsbtx docs/visual_overhaul/review/g4a_eterna_dump/props
          python tools/visual_overhaul/validate_g4a_eterna_recolor.py
          python tools/visual_overhaul/make_g4a_eterna_texture_sheet.py
      - name: Commit G4A environment grade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/field/maps/texture_sets/map_texture_set_074.nsbtx docs/visual_overhaul/G4A_ETERNA_TEXTURE_RECOLOR_REPORT.md docs/visual_overhaul/review/g4a_eterna_map_textures.png
          git commit -m "visual: grade Eterna Forest ground and underbrush"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
