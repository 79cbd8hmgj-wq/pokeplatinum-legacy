name: triage-hgss-battle-sprite-palette-order

on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/triage_hgss_battle_sprite_palette_order.py'
      - '.github/workflows/triage-hgss-battle-sprite-palette-order.yml'
      - 'docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_COMPATIBILITY.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  triage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HGSS_COMMIT: 9d8b7591f09b65804da2fb2dfd56f320633e0d36
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - run: python -m pip install Pillow
      - name: Fetch pinned HGSS donor
        run: |
          DONOR="$RUNNER_TEMP/pokeheartgold"
          mkdir -p "$DONOR"
          git -C "$DONOR" init
          git -C "$DONOR" remote add origin https://github.com/pret/pokeheartgold.git
          git -C "$DONOR" fetch --depth 1 origin "$HGSS_COMMIT"
          git -C "$DONOR" checkout --detach FETCH_HEAD
      - name: Triage palette order
        run: |
          python tools/visual_overhaul/triage_hgss_battle_sprite_palette_order.py \
            --donor-root "$RUNNER_TEMP/pokeheartgold/files/poketool/pokegra/pokegra" \
            --palette-manifest docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_COMPATIBILITY.json \
            --report docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_ORDER_TRIAGE.md \
            --manifest docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_ORDER.json
      - name: Commit triage outputs
        run: |
          if [ -z "$(git status --porcelain -- docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_ORDER_TRIAGE.md docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_ORDER.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_ORDER_TRIAGE.md docs/visual_overhaul/HGSS_BATTLE_SPRITE_PALETTE_ORDER.json
          git commit -m "docs: triage HGSS battle sprite palette order"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
