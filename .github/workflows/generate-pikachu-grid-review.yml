name: generate-pikachu-grid-review
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/generate_pikachu_grid_review.py'
      - '.github/workflows/generate-pikachu-grid-review.yml'
permissions:
  contents: write
jobs:
  grid:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - run: python -m pip install Pillow
      - run: python tools/visual_overhaul/generate_pikachu_grid_review.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/review/pikachu_male_front_frame*_grid.png
          git commit -m "docs: add Pikachu pixel-grid review" || exit 0
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
