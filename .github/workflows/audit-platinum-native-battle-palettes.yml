name: audit-platinum-native-battle-palettes
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/audit_platinum_native_battle_palettes.py'
      - '.github/workflows/audit-platinum-native-battle-palettes.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - run: python -m pip install Pillow
      - run: |
          python tools/visual_overhaul/audit_platinum_native_battle_palettes.py \
            --report docs/visual_overhaul/PLATINUM_NATIVE_BATTLE_PALETTE_AUDIT.md \
            --manifest docs/visual_overhaul/PLATINUM_NATIVE_BATTLE_PALETTE_AUDIT.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/PLATINUM_NATIVE_BATTLE_PALETTE_AUDIT.md docs/visual_overhaul/PLATINUM_NATIVE_BATTLE_PALETTE_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record Platinum native battle palette audit"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
