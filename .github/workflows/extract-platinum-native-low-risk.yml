name: extract-platinum-native-low-risk
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/extract_platinum_native_low_risk.py'
      - '.github/workflows/extract-platinum-native-low-risk.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - run: python -m pip install Pillow
      - run: python tools/visual_overhaul/extract_platinum_native_low_risk.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/PLATINUM_NATIVE_LOW_RISK_CANDIDATES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record native low-risk sprite candidates"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
