name: apply-g4-remainder-grade
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/recolor_g4_remainder.c'
      - 'tools/visual_overhaul/validate_g4_remainder.py'
      - '.github/workflows/apply-g4-remainder-grade.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libpng-dev
          mkdir -p g4-tools-build
          COMMON_SRC="tools/nitrobtx/src/common.c tools/nitrobtx/src/ns/chunks/tex.c tools/nitrobtx/src/ns/container.c tools/nitrobtx/src/ns/resource_dict.c tools/nitrobtx/src/ns/resource_name.c tools/nitrobtx/src/ns/resource_tree.c tools/nitrobtx/src/palette.c tools/nitrobtx/src/texture.c"
          gcc -std=gnu17 -O2 -Itools/nitrobtx/include $COMMON_SRC tools/visual_overhaul/recolor_g4_remainder.c -lpng -lm -o g4-tools-build/recolor-g4-rem
          gcc -std=gnu17 -O2 -Itools/nitrobtx/include $COMMON_SRC tools/nitrobtx/src/help.c tools/nitrobtx/src/options.c tools/nitrobtx/src/main.c -lpng -lm -o g4-tools-build/nitrobtx
          python -m pip install Pillow
      - name: Apply G4D and G4E
        run: |
          cp res/field/maps/texture_sets/map_texture_set_059.nsbtx /tmp/g4d_before.nsbtx
          cp res/field/maps/texture_sets/map_texture_set_061.nsbtx /tmp/g4e_before.nsbtx
          ./g4-tools-build/recolor-g4-rem spear /tmp/g4d_before.nsbtx /tmp/g4d_after.nsbtx
          ./g4-tools-build/recolor-g4-rem lakes /tmp/g4e_before.nsbtx /tmp/g4e_after.nsbtx
          mv /tmp/g4d_after.nsbtx res/field/maps/texture_sets/map_texture_set_059.nsbtx
          mv /tmp/g4e_after.nsbtx res/field/maps/texture_sets/map_texture_set_061.nsbtx
      - name: Validate contracts and render
        run: |
          rm -rf docs/visual_overhaul/review/g4d_spear_before docs/visual_overhaul/review/g4d_spear_after docs/visual_overhaul/review/g4e_lakes_before docs/visual_overhaul/review/g4e_lakes_after
          mkdir -p docs/visual_overhaul/review/g4d_spear_before docs/visual_overhaul/review/g4d_spear_after docs/visual_overhaul/review/g4e_lakes_before docs/visual_overhaul/review/g4e_lakes_after
          ./g4-tools-build/nitrobtx dump /tmp/g4d_before.nsbtx docs/visual_overhaul/review/g4d_spear_before
          ./g4-tools-build/nitrobtx dump res/field/maps/texture_sets/map_texture_set_059.nsbtx docs/visual_overhaul/review/g4d_spear_after
          ./g4-tools-build/nitrobtx dump /tmp/g4e_before.nsbtx docs/visual_overhaul/review/g4e_lakes_before
          ./g4-tools-build/nitrobtx dump res/field/maps/texture_sets/map_texture_set_061.nsbtx docs/visual_overhaul/review/g4e_lakes_after
          python tools/visual_overhaul/validate_g4_remainder.py
          python tools/visual_overhaul/make_texture_sheet.py docs/visual_overhaul/review/g4d_spear_after docs/visual_overhaul/review/g4d_spear_textures.png
          python tools/visual_overhaul/make_texture_sheet.py docs/visual_overhaul/review/g4e_lakes_after docs/visual_overhaul/review/g4e_lakes_textures.png
      - name: Commit remainder grade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/field/maps/texture_sets/map_texture_set_059.nsbtx res/field/maps/texture_sets/map_texture_set_061.nsbtx docs/visual_overhaul/G4D_G4E_G4F_REMAINDER.md docs/visual_overhaul/review/g4d_spear_textures.png docs/visual_overhaul/review/g4e_lakes_textures.png
          git commit -m "visual: grade Spear Pillar and lake environments"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
