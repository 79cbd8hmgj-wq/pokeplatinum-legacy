name: format-visual-overhaul

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'visual-overhaul-g2a' && github.event.pull_request.head.sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a

      - name: Install clang-format 19.1.1
        run: python -m pip install clang-format==19.1.1

      - name: Format visual overhaul sources
        run: |
          clang-format -i \
            include/constants/field/area_light.h \
            include/overlay005/field_effect_renderer.h \
            src/overlay005/area_data.c \
            src/overlay005/area_light.c \
            src/overlay005/field_effect_renderer.c \
            src/overlay005/fieldmap.c

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/constants/field/area_light.h \
            include/overlay005/field_effect_renderer.h \
            src/overlay005/area_data.c \
            src/overlay005/area_light.c \
            src/overlay005/field_effect_renderer.c \
            src/overlay005/fieldmap.c
          git commit -m "style: clang-format visual overhaul"
          git push origin HEAD:visual-overhaul-g2a
