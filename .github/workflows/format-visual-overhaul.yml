name: format-visual-overhaul

on: [pull_request]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: python -m pip install clang-format==19.1.1

      - name: Format files
        run: |
          clang-format -i include/constants/field/area_light.h
          clang-format -i include/overlay005/field_effect_renderer.h
          clang-format -i src/overlay005/area_data.c
          clang-format -i src/overlay005/area_light.c
          clang-format -i src/overlay005/field_effect_renderer.c
          clang-format -i src/overlay005/fieldmap.c

      - uses: actions/upload-artifact@v4
        with:
          name: formatted-visual-overhaul
          path: |
            include/constants/field/area_light.h
            include/overlay005/field_effect_renderer.h
            src/overlay005/area_data.c
            src/overlay005/area_light.c
            src/overlay005/field_effect_renderer.c
            src/overlay005/fieldmap.c
