name: apply-c3h-compat-once

on:
  push:
    branches: [ overhaul/c3h-species-compat ]
    paths:
      - '.github/workflows/apply-c3h-compat-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded compatibility rebuild
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          TM21 = {
              'charizard','butterfree','pidgey','pidgeotto','pidgeot','zubat','golbat','farfetchd','scyther','articuno','moltres','dragonite','mew','crobat','hoothoot','noctowl','natu','xatu','yanma','murkrow','delibird','mantine','skarmory','lugia','ho_oh','taillow','swellow','wingull','pelipper','masquerain','beautifly','ninjask','tropius','swablu','altaria','salamence','rayquaza','mothim','vespiquen','drifloon','drifblim','honchkrow','chatot','mantyke','togetic','togekiss','yanmega','shaymin/forms/sky','arceus'
          }
          TM78 = {
              'persian','staryu','starmie','mareep','flaaffy','ampharos','slowking','misdreavus','mismagius','corsola','nosepass','probopass','sableye','spoink','grumpig','vespiquen','omanyte','omastar','slugma','magcargo','lunatone','lileep','cradily','dialga','palkia','mew','arceus'
          }
          EXTRA = {
              'farfetchd':['TM31','HM06'],
              'electabuzz':['TM08','TM60'],
              'electivire':['TM08','TM60'],
              'vigoroth':['TM60'],
              'slaking':['TM60'],
              'shinx':['TM66'],
              'luxio':['TM66'],
              'luxray':['TM66'],
              'raichu':['TM91'],
          }

          def key(path: Path):
              rel = path.relative_to(Path('res/pokemon'))
              parts = rel.parts
              return '/'.join(parts[:-1])

          def sort_key(x):
              if x.startswith('TM') and x[2:].isdigit(): return (0,int(x[2:]))
              if x.startswith('HM') and x[2:].isdigit(): return (1,int(x[2:]))
              return (2,x)

          assert len(TM21) == 49
          assert len(TM78) == 27
          assert sum(len(v) for v in EXTRA.values()) == 12

          seen=set(); changed=0
          totals={'tm21_removed':0,'tm21_added':0,'tm78_removed':0,'tm78_added':0,'explicit_added':0}
          for path in sorted(Path('res/pokemon').glob('**/data.json')):
              try:
                  data=json.loads(path.read_text())
              except Exception:
                  continue
              learn=data.get('learnset')
              if not isinstance(learn,dict) or 'by_tm' not in learn:
                  continue
              k=key(path); seen.add(k)
              before=list(learn.get('by_tm') or [])
              after=[x for x in before if x not in ('TM21','TM78')]
              totals['tm21_removed'] += int('TM21' in before)
              totals['tm78_removed'] += int('TM78' in before)
              if k in TM21 and 'TM21' not in after:
                  after.append('TM21'); totals['tm21_added'] += 1
              if k in TM78 and 'TM78' not in after:
                  after.append('TM78'); totals['tm78_added'] += 1
              for item in EXTRA.get(k,[]):
                  if item not in after:
                      after.append(item); totals['explicit_added'] += 1
              after=sorted(set(after),key=sort_key)
              if after != before:
                  data['learnset']['by_tm']=after
                  path.write_text(json.dumps(data,indent=4,ensure_ascii=False)+'\n')
                  changed += 1

          missing={'TM21':sorted(TM21-seen),'TM78':sorted(TM78-seen),'explicit':sorted(set(EXTRA)-seen)}
          assert not any(missing.values()), missing
          assert totals['tm21_added'] == 49, totals
          assert totals['tm78_added'] == 27, totals
          for k,items in EXTRA.items():
              p=Path('res/pokemon')/k/'data.json'
              d=json.loads(p.read_text())
              cur=set(d['learnset']['by_tm'])
              assert all(x in cur for x in items), (k,items,cur)
          print(json.dumps({'files_changed':changed,**totals},indent=2))
          PY
          git diff --check

      - name: Commit compatibility source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add res/pokemon
          if git diff --cached --quiet; then
            echo 'No compatibility changes to commit'
            exit 0
          fi
          git commit -m 'Apply C3H TM compatibility rebuild'
          git push origin HEAD:${GITHUB_REF_NAME}
