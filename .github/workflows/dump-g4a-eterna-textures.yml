name: dump-g4a-eterna-textures
# G4A texture extraction review
on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/make_g4a_eterna_texture_sheet.py'
      - '.github/workflows/dump-g4a-eterna-textures.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  dump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build libpng-dev
      - run: meson setup build
      - run: meson compile -C build nitrobtx
      - run: python -m pip install Pillow
      - name: Dump Eterna texture banks
        run: |
          rm -rf docs/visual_overhaul/review/g4a_eterna_dump
          mkdir -p docs/visual_overhaul/review/g4a_eterna_dump/map
          mkdir -p docs/visual_overhaul/review/g4a_eterna_dump/props
          ./build/tools/nitrobtx/nitrobtx dump res/field/maps/texture_sets/map_texture_set_053.nsbtx docs/visual_overhaul/review/g4a_eterna_dump/map
          ./build/tools/nitrobtx/nitrobtx dump res/field/props/texture_sets/prop_texture_set_050.nsbtx docs/visual_overhaul/review/g4a_eterna_dump/props
          python tools/visual_overhaul/make_g4a_eterna_texture_sheet.py
      - name: Commit review sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/review/g4a_eterna_map_textures.png docs/visual_overhaul/review/g4a_eterna_prop_textures.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add G4A Eterna texture review sheets"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
