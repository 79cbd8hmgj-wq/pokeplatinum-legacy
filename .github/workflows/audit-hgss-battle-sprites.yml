name: audit-hgss-battle-sprites

on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/audit_hgss_battle_sprites.py'
      - '.github/workflows/audit-hgss-battle-sprites.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HGSS_COMMIT: 9d8b7591f09b65804da2fb2dfd56f320633e0d36
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Fetch pinned HGSS donor assets
        run: |
          DONOR="$RUNNER_TEMP/pokeheartgold"
          mkdir -p "$DONOR"
          git -C "$DONOR" init
          git -C "$DONOR" remote add origin https://github.com/pret/pokeheartgold.git
          git -C "$DONOR" fetch --depth 1 origin "$HGSS_COMMIT"
          git -C "$DONOR" checkout --detach FETCH_HEAD

      - name: Audit base Pokemon battle sprites
        run: |
          python tools/visual_overhaul/audit_hgss_battle_sprites.py \
            --donor-root "$RUNNER_TEMP/pokeheartgold/files/poketool/pokegra/pokegra" \
            --report docs/visual_overhaul/HGSS_BATTLE_SPRITE_AUDIT.md

      - name: Commit audit report
        run: |
          if git diff --quiet -- docs/visual_overhaul/HGSS_BATTLE_SPRITE_AUDIT.md; then
            echo "Battle sprite audit report already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual_overhaul/HGSS_BATTLE_SPRITE_AUDIT.md
          git commit -m "docs: record HGSS battle sprite audit"
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
