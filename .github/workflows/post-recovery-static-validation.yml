name: post-recovery-static-validation

on:
  push:
    branches:
      - fix/post-recovery-static-validation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Diagnose postgame
        run: python3 tools/overhaul/postgame/validate_postgame.py || true
      - name: Diagnose mystery starter
        run: python3 tools/overhaul/validate_mystery_starter.py --no-report || true
