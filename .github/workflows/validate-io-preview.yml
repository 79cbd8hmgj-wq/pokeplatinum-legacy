name: validate-io-preview

on:
  pull_request:
    paths:
      - 'res/graphics/map_popups/**'
      - 'src/overlay005/map_name_popup.c'
      - 'include/overlay005/map_name_popup.h'
      - 'tools/visual_overhaul/io_preview/**'
      - '.github/workflows/validate-io-preview.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
          python -m pip install pillow

      - name: Build nitrogfx
        run: |
          cd tools/nitrogfx
          gcc -O1 -w -o "$RUNNER_TEMP/nitrogfx" main.c gfx.c convert_png.c jasc_pal.c lz.c rl.c huff.c json.c cJSON.c util.c font.c -lpng -lm

      - name: Card art is reproducible
        run: |
          cp -r res/graphics/map_popups "$RUNNER_TEMP/committed"
          python tools/visual_overhaul/io_preview/build_eterna_forest_card.py
          python tools/visual_overhaul/io_preview/build_sinnoh_area_cards.py
          python - "$RUNNER_TEMP/committed" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          new = sorted(Path("res/graphics/map_popups").glob("card_*.png"))
          old = sorted(Path(sys.argv[1]).glob("card_*.png"))
          assert [p.name for p in new] == [p.name for p in old], "generators wrote a different set of card PNGs than the repo contains"
          for p in new:
              a, b = Image.open(p), Image.open(Path(sys.argv[1]) / p.name)
              assert a.tobytes() == b.tobytes() and a.getpalette() == b.getpalette(), f"{p.name} is stale; rerun the generators"
          print(f"{len(new)} card PNGs match generator output")
          PY

      - name: Static gates
        run: python tools/visual_overhaul/io_preview/validate_area_cards.py --nitrogfx "$RUNNER_TEMP/nitrogfx" --mockup "$RUNNER_TEMP/mockup.png"

      - uses: actions/upload-artifact@v4
        with:
          name: io-preview-mockup
          path: ${{ runner.temp }}/mockup.png
