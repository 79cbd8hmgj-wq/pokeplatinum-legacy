name: import-hgss-pokemon-icons

on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/import_hgss_pokemon_icons.py'
      - '.github/workflows/import-hgss-pokemon-icons.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HGSS_COMMIT: 9d8b7591f09b65804da2fb2dfd56f320633e0d36
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Fetch pinned HGSS donor assets
        run: |
          DONOR="$RUNNER_TEMP/pokeheartgold"
          mkdir -p "$DONOR"
          git -C "$DONOR" init
          git -C "$DONOR" remote add origin https://github.com/pret/pokeheartgold.git
          git -C "$DONOR" fetch --depth 1 origin "$HGSS_COMMIT"
          git -C "$DONOR" checkout --detach FETCH_HEAD

      - name: Import compatible Pokemon icons
        run: |
          python tools/visual_overhaul/import_hgss_pokemon_icons.py \
            --donor-root "$RUNNER_TEMP/pokeheartgold/files/poketool/icongra/poke_icon"

      - name: Commit imported icon art
        run: |
          if git diff --quiet -- res/pokemon; then
            echo "Platinum Pokemon icons already match the compatible HGSS donor art."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/pokemon
          git commit -m "visual: import compatible HGSS Pokemon icons"

          # Other visual workflows may advance the branch while this import is
          # running. Rebase the generated asset commit before pushing.
          git fetch origin visual-overhaul-g2a
          git rebase origin/visual-overhaul-g2a
          git push origin HEAD:visual-overhaul-g2a
