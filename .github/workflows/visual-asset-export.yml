name: visual-asset-export

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/visual-asset-export.yml'
      - 'res/prebuilt/data/mmodel/fldeff.narc'
      - 'res/field/maps/texture_sets/map_texture_set_053.nsbtx'
      - 'res/field/props/models/prop_model_147.nsbmd'
      - 'res/field/props/models/mansion_door.nsbmd'
      - 'res/graphics/windows/**'
      - 'res/graphics/party_menu/**'
      - 'res/graphics/pokemon_summary_screen/**'
      - 'res/graphics/bag/**'
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Collect icon comparison set
        run: |
          mkdir -p visual-export/platinum-icons visual-export/hgss-icons visual-export/hgss-area-windows visual-export/hgss-zukan
          cp res/pokemon/bulbasaur/icon.png visual-export/platinum-icons/bulbasaur.png
          cp res/pokemon/pikachu/icon.png visual-export/platinum-icons/pikachu.png
          cp res/pokemon/gengar/icon.png visual-export/platinum-icons/gengar.png
          cp res/pokemon/lucario/icon.png visual-export/platinum-icons/lucario.png
          git clone --depth 1 https://github.com/79cbd8hmgj-wq/pokeheartgold.git /tmp/pokeheartgold
          cp /tmp/pokeheartgold/files/poketool/icongra/poke_icon/poke_icon_00000007.png visual-export/hgss-icons/bulbasaur.png
          cp /tmp/pokeheartgold/files/poketool/icongra/poke_icon/poke_icon_00000031.png visual-export/hgss-icons/pikachu.png
          cp /tmp/pokeheartgold/files/poketool/icongra/poke_icon/poke_icon_00000100.png visual-export/hgss-icons/gengar.png
          cp /tmp/pokeheartgold/files/poketool/icongra/poke_icon/poke_icon_00000454.png visual-export/hgss-icons/lucario.png
          cp /tmp/pokeheartgold/files/data/gs_areawindow/*.png visual-export/hgss-area-windows/
          find /tmp/pokeheartgold/files/graphic/zukan_gra -maxdepth 1 -name '*.png' -print0 | xargs -0 -I{} cp {} visual-export/hgss-zukan/

      - name: Build field-effect reference report
        run: |
          grep -R -n -E 'FieldEffectManager_Load(Model|Animation)|ov5_021DF9E0|ov5_021DFA14|ov5_021DFA3C' src/overlay005 include/overlay005 > fldeff_refs.txt || true

      - uses: actions/upload-artifact@v7
        with:
          name: platinum-visual-assets
          path: |
            fldeff_refs.txt
            visual-export/
            res/prebuilt/data/mmodel/fldeff.narc
            res/field/maps/texture_sets/map_texture_set_053.nsbtx
            res/field/props/models/prop_model_147.nsbmd
            res/field/props/models/mansion_door.nsbmd
            res/graphics/windows
            res/graphics/party_menu
            res/graphics/pokemon_summary_screen
            res/graphics/bag
          retention-days: 1
