name: generate-visual-ui

on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/generate_ui_foundation.py'
      - '.github/workflows/generate-visual-ui.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate UI foundation
        run: python tools/visual_overhaul/generate_ui_foundation.py

      - name: Commit generated PNG assets
        run: |
          if git diff --quiet -- res/graphics/windows/standard_system.png res/graphics/windows/standard_field.png res/graphics/windows/scroll_cursor.png res/graphics/windows/wait_dial.png; then
            echo "UI assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/graphics/windows/standard_system.png res/graphics/windows/standard_field.png res/graphics/windows/scroll_cursor.png res/graphics/windows/wait_dial.png
          git commit -m "visual: regenerate global UI window assets"
          git push origin HEAD:visual-overhaul-g2a
