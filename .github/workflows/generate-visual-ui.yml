name: generate-visual-ui

on:
  push:
    branches: [ visual-overhaul-g2a ]
    paths:
      - 'tools/visual_overhaul/generate_ui_foundation.py'
      - 'tools/visual_overhaul/generate_start_menu_ui.py'
      - 'tools/visual_overhaul/generate_battle_ui.py'
      - 'tools/visual_overhaul/generate_party_menu_ui.py'
      - 'tools/visual_overhaul/generate_summary_ui.py'
      - '.github/workflows/generate-visual-ui.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: visual-overhaul-g2a

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate UI foundation
        run: |
          python tools/visual_overhaul/generate_ui_foundation.py
          python tools/visual_overhaul/generate_start_menu_ui.py
          python tools/visual_overhaul/generate_battle_ui.py
          python tools/visual_overhaul/generate_party_menu_ui.py
          python tools/visual_overhaul/generate_summary_ui.py

      - name: Commit generated PNG assets
        run: |
          if git diff --quiet -- res/graphics/windows/standard_system.png res/graphics/windows/standard_field.png res/graphics/windows/scroll_cursor.png res/graphics/windows/wait_dial.png res/graphics/start_menu/cursor.png res/graphics/battle/healthbox/player_singles.png res/graphics/battle/healthbox/player_doubles.png res/graphics/battle/healthbox/enemy.png res/graphics/battle/healthbox/healthbox_parts.png res/graphics/party_menu/shared.pal res/graphics/pokemon_summary_screen/tiles_main.pal res/graphics/pokemon_summary_screen/sprites.pal; then
            echo "UI assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/graphics/windows/standard_system.png res/graphics/windows/standard_field.png res/graphics/windows/scroll_cursor.png res/graphics/windows/wait_dial.png res/graphics/start_menu/cursor.png res/graphics/battle/healthbox/player_singles.png res/graphics/battle/healthbox/player_doubles.png res/graphics/battle/healthbox/enemy.png res/graphics/battle/healthbox/healthbox_parts.png res/graphics/party_menu/shared.pal res/graphics/pokemon_summary_screen/tiles_main.pal res/graphics/pokemon_summary_screen/sprites.pal
          git commit -m "visual: regenerate global UI foundation assets"
          git push origin HEAD:visual-overhaul-g2a
