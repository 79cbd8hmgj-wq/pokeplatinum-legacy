name: Donor review queue

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/visual_overhaul/build_donor_review_queue.py"
      - "docs/visual_overhaul/DONOR_ASSET_CATALOG.json"
      - ".github/workflows/donor-review-queue.yml"

permissions:
  contents: write

jobs:
  build-review-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deterministic review queue
        run: |
          python3 tools/visual_overhaul/build_donor_review_queue.py \
            --catalog docs/visual_overhaul/DONOR_ASSET_CATALOG.json \
            --write-json docs/visual_overhaul/DONOR_REVIEW_QUEUE.json \
            --write-md docs/visual_overhaul/DONOR_REVIEW_QUEUE.md \
            --batch-size 100

      - name: Validate queue coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("docs/visual_overhaul/DONOR_ASSET_CATALOG.json").read_text())
          queue = json.loads(Path("docs/visual_overhaul/DONOR_REVIEW_QUEUE.json").read_text())

          assets = catalog["assets"]
          records = queue["records"]

          assert len(records) == len(assets)
          assert queue["asset_count"] == len(assets)

          catalog_ids = {a["asset_id"] for a in assets}
          queue_ids = [r["asset_id"] for r in records]
          assert len(queue_ids) == len(set(queue_ids))
          assert set(queue_ids) == catalog_ids

          for source in {"ranger2", "hgss", "diamond", "pmd_sky"}:
              assert source in queue["source_counts"]

          print("Queue assets:", queue["asset_count"])
          print("Lane counts:", queue["lane_counts"])
          print("Batch count:", len(queue["batches"]))
          PY

      - name: Commit generated review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/visual_overhaul/DONOR_REVIEW_QUEUE.json \
            docs/visual_overhaul/DONOR_REVIEW_QUEUE.md
          if git diff --cached --quiet; then
            echo "No review queue changes."
            exit 0
          fi
          git commit -m "visual: generate donor review queue"
          git pull --rebase origin main
          git push
