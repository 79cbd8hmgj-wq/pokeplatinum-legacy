name: Archive original C3H ledgers

on:
  push:
    branches: [overhaul/c3h-ledger-archive]
    paths: ['.github/workflows/archive-c3h-ledgers.yml']

permissions:
  contents: write

jobs:
  archive:
    if: github.event.head_commit.message != 'Archive original C3H guarded ledgers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: overhaul/c3h-ledger-archive
          fetch-depth: 0
      - name: Recover exact historical ledgers
        run: |
          python3 - <<'PY'
          import ast,base64,gzip,json,re,subprocess
          from pathlib import Path
          HIST='dceb548782be5c3ed30afba39a8b5727fdd6716d'
          src=subprocess.check_output(['git','show',f'{HIST}:.github/workflows/c3h-apply-species.yml'],text=True)
          m=re.search(r'^\s*BLOBS=(\[.*\])\s*$',src,flags=re.M)
          assert m, 'historical BLOBS array missing'
          blobs=ast.literal_eval(m.group(1))
          ledgers=[json.loads(gzip.decompress(base64.b64decode(x))) for x in blobs]
          counts=[len(x['changes']) for x in ledgers]
          assert counts == [67,27,40,53,38], counts
          assert sum(counts) == 225
          names=[
            'platinum_c3h_l1_guarded_ledger_v1.json',
            'platinum_c3h_l2_gen1_guarded_ledger_v1.json',
            'platinum_c3h_l3_gen2_guarded_ledger_v1.json',
            'platinum_c3h_l4_gen3_guarded_ledger_v1.json',
            'platinum_c3h_l5_sinnoh_guarded_ledger_v1.json',
          ]
          out=Path('overhaul/ledgers')
          out.mkdir(parents=True,exist_ok=True)
          for name,ledger,expected in zip(names,ledgers,counts):
              assert ledger.get('version')==1
              assert ledger.get('domain')=='pokemon'
              assert len(ledger['changes'])==expected
              (out/name).write_text(json.dumps(ledger,indent=2)+'\n',encoding='utf-8')
          manifest={
            'version':1,
            'source_historical_commit':HIST,
            'ledger_counts':dict(zip(names,counts)),
            'total_operations':sum(counts),
            'recovery_note':'Decoded verbatim from the five gzip+base64 ledger payloads embedded in the historical C3H species application workflow.'
          }
          (out/'README_RECOVERY.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY
          git diff --check
      - name: Commit archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add overhaul/ledgers
          git diff --cached --check
          git commit -m 'Archive original C3H guarded ledgers'
          git push origin HEAD:overhaul/c3h-ledger-archive
