name: build trainer pilot

# Pilot-only build of both US revisions + static verification of the trainer front sprite pilot.
# Remove this file when the pilot is merged or abandoned.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/trainer-sprite-pilot" ]
    paths:
      - "res/trainers/**"
      - "tools/visual_overhaul/trainer_*.py"
      - "docs/visual_overhaul/pilots/trainer_front_pilot_v1/**"
      - ".github/workflows/build-trainer-pilot.yml"

env:
  LM_LICENSE_FILE: "${{ github.workspace }}/tools/cw/license.dat"
  BUILD: /var/tmp/pokeplatinum

jobs:
  build:
    name: build + verify (US rev ${{ matrix.revision }})
    strategy:
      fail-fast: false
      matrix:
        revision: [0, 1]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bison flex g++ gcc-arm-none-eabi git make ninja-build pkg-config python3 python3-pil wget xz-utils

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Static pilot verification (files, contracts, allow-list)
        run: python3 tools/visual_overhaul/trainer_front_pilot.py verify

      - name: Install Metroskrew
        run: sudo make skrew

      - name: Configure Repo
        run: make configure ROM_REVISION=${{ matrix.revision }}

      - name: Build Modded ROM
        run: make rom ROM_REVISION=${{ matrix.revision }}

      - name: Verify built trfgra.narc members against HGSS hashes
        run: |
          NARC=$(find "$BUILD" -name trfgra.narc | head -1)
          echo "trfgra.narc: $NARC"
          test -n "$NARC"
          python3 tools/visual_overhaul/trainer_front_pilot.py verify --narc "$NARC"

      - name: Record build provenance
        run: |
          ROM="$BUILD/pokeplatinum.us.nds"
          echo "PILOT_BUILD source=${{ github.sha }} revision=${{ matrix.revision }} rom_sha256=$(sha256sum "$ROM" | cut -d' ' -f1) bytes=$(stat -c %s "$ROM")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload built ROM
        uses: actions/upload-artifact@v7
        with:
          name: pokeplatinum-trainer-pilot-us-rev${{ matrix.revision }}-${{ github.sha }}
          path: ${{ env.BUILD }}/pokeplatinum.us.nds
