name: Ranger full render census

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/visual_overhaul/nitro_narc.py"
      - "tools/visual_overhaul/inspect_ranger_assets.py"
      - "tools/visual_overhaul/render_ranger_nitro_preview.py"
      - "tools/visual_overhaul/render_ranger_ncer_preview.py"
      - "tools/visual_overhaul/render_ranger_pokemon_package.py"
      - "tools/visual_overhaul/render_ranger_pokemon_batch.py"
      - "tools/visual_overhaul/audit_ranger_render_compatibility.py"
      - "tools/visual_overhaul/select_ranger_geometry_candidates.py"
      - ".github/workflows/ranger-structural-census.yml"

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Platinum overhaul
        uses: actions/checkout@v4
        with:
          path: platinum

      - name: Checkout Ranger donor corpus
        uses: actions/checkout@v4
        with:
          repository: 79cbd8hmgj-wq/pokeranger2
          path: ranger2

      - name: Render complete Ranger Pokémon donor pool
        id: render
        working-directory: platinum
        shell: bash
        run: |
          set +e
          python3 tools/visual_overhaul/render_ranger_pokemon_batch.py \
            --ranger-root ../ranger2 \
            --output-dir /tmp/ranger_all \
            --write-json docs/visual_overhaul/RANGER_FULL_RENDER_CENSUS.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit 80x80 compatibility
        working-directory: platinum
        run: |
          python3 tools/visual_overhaul/audit_ranger_render_compatibility.py \
            --render-root /tmp/ranger_all \
            --target-size 80 \
            --write-json docs/visual_overhaul/RANGER_RENDER_COMPATIBILITY.json \
            --write-md docs/visual_overhaul/RANGER_RENDER_COMPATIBILITY.md

      - name: Build geometry candidate shortlist
        working-directory: platinum
        run: |
          python3 tools/visual_overhaul/select_ranger_geometry_candidates.py \
            --compatibility-json docs/visual_overhaul/RANGER_RENDER_COMPATIBILITY.json \
            --write-json docs/visual_overhaul/RANGER_GEOMETRY_CANDIDATES.json \
            --write-md docs/visual_overhaul/RANGER_GEOMETRY_CANDIDATES.md

      - name: Build full-render summary
        working-directory: platinum
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = Path("docs/visual_overhaul/RANGER_FULL_RENDER_CENSUS.json")
          out = Path("docs/visual_overhaul/RANGER_FULL_RENDER_CENSUS.md")
          data = json.loads(src.read_text())
          rows = data["rows"]
          failures = [r for r in rows if r["status"] == "error"]
          lines = [
              "# Ranger Full Render Census",
              "",
              "Generated automatically from the complete pokeranger2 Pokémon donor pool.",
              "",
              "## Summary",
              "",
              f"- Packages considered: **{data['packages_considered']}**",
              f"- Successful packages: **{data['successes']}**",
              f"- Failed packages: **{data['failures']}**",
              f"- NCER cells rendered: **{data['rendered_cells']}**",
              "",
              "## Failures",
              "",
          ]
          if failures:
              lines += [
                  f"- #{r['species']:03d} variant {r['variant']:02d}: {r['error']}"
                  for r in failures
              ]
          else:
              lines.append("- None")
          out.write_text("\n".join(lines) + "\n")
          PY

      - name: Upload rendered Ranger cells for QA
        uses: actions/upload-artifact@v4
        with:
          name: ranger-full-render-census
          path: /tmp/ranger_all
          if-no-files-found: warn
          retention-days: 14

      - name: Commit census reports
        working-directory: platinum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/visual_overhaul/RANGER_FULL_RENDER_CENSUS.json \
            docs/visual_overhaul/RANGER_FULL_RENDER_CENSUS.md \
            docs/visual_overhaul/RANGER_RENDER_COMPATIBILITY.json \
            docs/visual_overhaul/RANGER_RENDER_COMPATIBILITY.md \
            docs/visual_overhaul/RANGER_GEOMETRY_CANDIDATES.json \
            docs/visual_overhaul/RANGER_GEOMETRY_CANDIDATES.md
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "visual: record full Ranger render census"
          git push
