name: Recover canonical C3H ledgers

on:
  push:
    branches: [overhaul/canonical-docs]
    paths: ['.github/workflows/recover-canonical-c3h-ledgers.yml']

permissions:
  contents: write

jobs:
  recover:
    if: github.event.head_commit.message != 'Docs: recover canonical C3H 225-operation ledger set'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: overhaul/canonical-docs
          fetch-depth: 0

      - name: Decode exact historical C3H ledgers
        run: |
          python3 - <<'PY'
          import ast, base64, gzip, json, re, subprocess
          from pathlib import Path

          HIST = 'dceb548782be5c3ed30afba39a8b5727fdd6716d'
          subprocess.run(['git', 'fetch', 'origin', HIST], check=False)
          text = subprocess.check_output(
              ['git', 'show', f'{HIST}:.github/workflows/c3h-apply-species.yml'],
              text=True,
          )
          match = re.search(r'^\s*BLOBS=(\[.*\])\s*$', text, flags=re.M)
          assert match, 'historical BLOBS array not found'
          blobs = ast.literal_eval(match.group(1))
          assert len(blobs) == 5, len(blobs)
          ledgers = [json.loads(gzip.decompress(base64.b64decode(blob))) for blob in blobs]
          counts = [len(ledger['changes']) for ledger in ledgers]
          assert counts == [67, 27, 40, 53, 38], counts
          assert sum(counts) == 225

          out = Path('docs/overhaul/implementation/ledgers')
          out.mkdir(parents=True, exist_ok=True)
          names = [
              'platinum_c3h_l1_guarded_ledger_v1.json',
              'platinum_c3h_l2_gen1_guarded_ledger_v1.json',
              'platinum_c3h_l3_gen2_guarded_ledger_v1.json',
              'platinum_c3h_l4_gen3_guarded_ledger_v1.json',
              'platinum_c3h_l5_sinnoh_guarded_ledger_v1.json',
          ]
          for ledger, name, expected in zip(ledgers, names, counts):
              assert ledger.get('version') == 1
              assert ledger.get('domain') == 'pokemon'
              assert len(ledger['changes']) == expected
              (out / name).write_text(json.dumps(ledger, indent=2) + '\n', encoding='utf-8')

          summary = {
              'historical_commit': HIST,
              'counts': counts,
              'total_operations': sum(counts),
              'files': names,
          }
          (out / 'C3H_LEDGER_PROVENANCE.json').write_text(
              json.dumps(summary, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2))
          PY
          git diff --check

      - name: Commit exact recovered ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/overhaul/implementation/ledgers/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No ledger changes to commit.'
            exit 0
          fi
          git commit -m 'Docs: recover canonical C3H 225-operation ledger set'
          git push origin HEAD:overhaul/canonical-docs
