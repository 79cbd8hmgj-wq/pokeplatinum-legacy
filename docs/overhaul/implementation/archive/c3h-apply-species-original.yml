name: C3H apply species ledgers
on:
  push:
    branches: [overhaul/c3h-species-compat]
    paths: ['.github/workflows/c3h-apply-species.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply C3H 225 species operations'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: overhaul/c3h-species-compat
          fetch-depth: 0
      - name: Apply semantic-guarded ledgers
        shell: bash
        run: |
          cat > /tmp/apply.py <<'PY'
          import base64,gzip,json
          from pathlib import Path
          BLOBS=["","","","",""]
          ledgers=[json.loads(gzip.decompress(base64.b64decode(x))) for x in BLOBS]
          changes=[c for l in ledgers for c in l["changes"]]
          assert [len(l["changes"]) for l in ledgers]==[67,27,40,53,38]
          assert len(changes)==225
          
          root=Path("res/pokemon")
          by_species={}
          for c in changes:
              by_species.setdefault(c["species"],[]).append(c)
          
          applied=0
          for species, ops in by_species.items():
              path=root/species/"data.json"
              if not path.exists():
                  raise SystemExit(f"missing species file: {species}")
              d=json.loads(path.read_text(encoding="utf-8"))
              level=d["learnset"]["by_level"]
              for c in ops:
                  kind=c["operation"]
                  if kind=="set_base_stat":
                      cur=d["base_stats"][c["stat"]]
                      if cur==c["from"]:
                          d["base_stats"][c["stat"]]=c["to"]; applied+=1
                      elif cur!=c["to"]:
                          raise AssertionError((species,kind,c["stat"],cur,c["from"],c["to"]))
                  elif kind=="set_types":
                      cur=d["types"]
                      if cur==c["from"]:
                          d["types"]=c["to"]; applied+=1
                      elif cur!=c["to"]:
                          raise AssertionError((species,kind,cur,c["from"],c["to"]))
                  elif kind=="set_abilities":
                      cur=d["abilities"]
                      if cur==c["from"]:
                          d["abilities"]=c["to"]; applied+=1
                      elif cur!=c["to"]:
                          raise AssertionError((species,kind,cur,c["from"],c["to"]))
                  elif kind=="insert_level_move":
                      e=c["entry"]
                      if e not in level:
                          level.append(e); applied+=1
                  elif kind=="remove_level_move":
                      e=c["entry"]
                      if e in level:
                          level.remove(e); applied+=1
                  elif kind=="replace_level_move":
                      a,b=c["from"],c["to"]
                      if a in level:
                          level[level.index(a)]=b; applied+=1
                      elif b not in level:
                          raise AssertionError((species,kind,a,b,level))
                  else:
                      raise AssertionError(("unknown op",kind))
              level.sort(key=lambda x:x[0])
              path.write_text(json.dumps(d,indent=4,ensure_ascii=False)+"\n",encoding="utf-8")
          
          print(json.dumps({"ledger_counts":[67,27,40,53,38],"total_ops":225,"operations_applied":applied,"species_touched":len(by_species)},indent=2))
          
          PY
          python3 /tmp/apply.py
          git diff --check
      - name: Commit species source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add res/pokemon
          git diff --cached --check
          git diff --cached --quiet && { echo 'No species changes to commit'; exit 0; }
          git commit -m 'Apply C3H 225 species operations'
          git push origin HEAD:overhaul/c3h-species-compat
